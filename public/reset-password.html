<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuntio - Сброс пароля</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0a0a0a; }
    .card {
      background: #111113;
      border: 1px solid #1f1f22;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card:hover {
      transform: translateY(-8px);
      border-color: #52525b;
    }
    input {
      background: #0a0a0a;
      transition: all 0.3s ease;
    }
    input:focus {
      border-color: #52525b;
      box-shadow: 0 0 0 4px rgba(82, 82, 91, 0.15);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white select-none">
  <div class="w-full max-w-md px-6 py-12">
    
    <div class="flex justify-center mb-12">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center">
          <span class="text-black text-3xl font-bold">N</span>
        </div>
        <h1 class="text-4xl font-medium tracking-tight">Nuntio</h1>
      </div>
    </div>

    <div class="card rounded-3xl p-10">
      <h2 class="text-2xl font-medium text-center mb-1">Восстановление</h2>
      <p id="formSubtitle" class="text-zinc-400 text-center mb-10 text-sm">Введите ваш Email для получения кода</p>

      <form id="emailForm" class="space-y-8">
        <div>
          <label class="block text-xs tracking-widest text-zinc-500 mb-2">ВАШ EMAIL</label>
          <input 
            type="email" 
            id="resetEmail" 
            placeholder="your@email.com" 
            required
            class="w-full border border-zinc-800 focus:border-zinc-600 rounded-2xl px-6 py-4 text-base">
        </div>
        <button 
          type="submit"
          class="w-full bg-white text-black py-4 rounded-2xl font-medium text-base hover:bg-zinc-100 active:scale-[0.97] transition">
          Получить код
        </button>
      </form>

      <form id="passwordForm" class="space-y-6 hidden">
        <div>
          <label class="block text-xs tracking-widest text-zinc-500 mb-2">КОД ПОДТВЕРЖДЕНИЯ</label>
          <input 
            type="text" 
            id="resetCode" 
            placeholder="000000" 
            maxlength="6"
            required
            class="w-full border border-zinc-800 focus:border-zinc-600 rounded-2xl px-6 py-4 text-base tracking-[6px] text-center font-bold">
        </div>

        <div>
          <label class="block text-xs tracking-widest text-zinc-500 mb-2">НОВЫЙ ПАРОЛЬ</label>
          <input 
            type="password" 
            id="newPassword" 
            placeholder="••••••••" 
            required
            class="w-full border border-zinc-800 focus:border-zinc-600 rounded-2xl px-6 py-4 text-base">
        </div>

        <button 
          type="submit"
          class="w-full bg-white text-black py-4 rounded-2xl font-medium text-base hover:bg-zinc-100 active:scale-[0.97] transition">
          Сохранить и войти
        </button>
      </form>

      <p class="text-center mt-10 text-zinc-400 text-sm">
        Вспомнили пароль? 
        <a href="login.html" class="text-white hover:underline">Вернуться назад</a>
      </p>
    </div>
  </div>

  <script>
    let savedEmail = '';

    // Обработка отправки Email
    document.getElementById('emailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();

      try {
        const res = await fetch('http://localhost:3000/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (res.ok) {
          savedEmail = email;
          // Плавная смена интерфейса на Шаг 2
          document.getElementById('emailForm').classList.add('hidden');
          document.getElementById('passwordForm').classList.remove('hidden');
          document.getElementById('formSubtitle').textContent = `Код отправлен на ${email}`;
          document.getElementById('formSubtitle').classList.add('text-emerald-400');
        } else {
          alert(data.message || 'Ошибка');
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
      }
    });

    // Обработка отправки Кода и Нового пароля
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('resetCode').value.trim();
      const newPassword = document.getElementById('newPassword').value;

      try {
        const res = await fetch('http://localhost:3000/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: savedEmail, code, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          alert('Отлично! Пароль успешно изменен.');
          window.location.href = 'login.html'; // Редирект на вход
        } else {
          alert(data.message || 'Неверный код');
        }
      } catch (err) {
        alert('Ошибка связи с сервером');
      }
    });
  </script>
</body>
</html>
