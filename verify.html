<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuntio - Подтверждение</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Подтверждение Email</h2>
        <p id="status">Пожалуйста, подождите, проверяем ваш токен...</p>
        <p><a href="login.html">Перейти ко входу</a></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('status').innerText = 'Токен подтверждения не найден.';
        } else {
            fetch(`https://nuntio-chat.onrender.com/api/auth/verify?token=${token}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status').innerText = data.message;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('status').innerText = 'Ошибка при отправке запроса.';
                });
        }
    </script>
</body>
</html>
