<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuntio - Восстановление пароля</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Восстановление пароля</h2>
        <form id="resetForm">
            <input type="email" id="email" placeholder="Введите ваш Email" required>
            <button type="submit">Сбросить пароль</button>
        </form>
        <p><a href="login.html">Вернуться ко входу</a></p>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('https://nuntio-chat.onrender.com/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                alert(data.message);
            } catch (error) {
                console.error(error);
                alert('Не удалось отправить запрос.');
            }
        });
    </script>
</body>
</html>
