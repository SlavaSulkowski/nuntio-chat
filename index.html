<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuntio - Чат</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h2>Nuntio Chat</h2>
            <button id="logoutBtn">Выйти</button>
        </header>
        <div id="messages" class="messages-box"></div>
        <form id="messageForm" class="input-box">
            <input type="text" id="msgInput" placeholder="Введите сообщение..." required autocomplete="off">
            <button type="submit">Отправить</button>
        </form>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Загрузка истории сообщений
        async function loadMessages() {
            try {
                const response = await fetch('https://nuntio-chat.onrender.com/api/messages', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                    return;
                }

                const messages = await response.json();
                const box = document.getElementById('messages');
                box.innerHTML = '';
                
                messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.innerHTML = `<strong>${m.username}:</strong> ${m.text}`;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            } catch (error) {
                console.error('Ошибка загрузки сообщений:', error);
            }
        }

        // Отправка нового сообщения
        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('msgInput');
            const text = input.value;

            try {
                const response = await fetch('https://nuntio-chat.onrender.com/api/messages', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text })
                });

                if (response.ok) {
                    input.value = '';
                    loadMessages(); // Перезагружаем список
                }
            } catch (error) {
                console.error(error);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });

        // Первичная загрузка и автообновление каждые 3 секунды (пока нет WebSocket)
        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
